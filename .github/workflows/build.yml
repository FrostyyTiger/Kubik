# Builds a standalone Windows Kubik.exe on every push to main.
#
# Why the Godot binary is downloaded by hand rather than using a community
# "setup-godot" action: those actions lag behind Godot releases, and an export
# template that does not exactly match the engine version silently produces a
# broken build. Pinning the version here means the build can never drift.
#
# Since the .gdextension landed, this job also CROSS-COMPILES the extension for
# Windows with mingw-w64 before exporting. It has to: gdext/bin/ is gitignored,
# so a fresh clone has no library, and Godot's export copies every library named
# in kubik.gdextension next to the exe - it does not skip a missing one, it fails
# the export ("Failed to copy shared object ... libkubik.windows.template_release
# .x86_64.dll"). That is why this workflow was red from the day the .gdextension
# was added until 2026-09-04.

name: build

on:
  push:
    # AND ci/** so a change to this file can be proven on its own branch. There
    # is no other way to test a workflow: it only ever runs from a pushed ref.
    branches: [main, "ci/**"]
  # Lets you trigger a build from the Actions tab without pushing anything.
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  # THE SAME PIN selftest.yml uses. Both jobs build the same sources against the
  # same godot-cpp against the same engine API; if these two ever disagree, the
  # library the self-test proved is not the library the player runs.
  GODOT_CPP_COMMIT: "26fb7ab5821e6a1096f62c22f7462d1d70caa332"

jobs:
  windows:
    # A Linux runner cross-building a Windows exe is normal and intended: the
    # Windows export template *is* a Windows binary, and exporting just staples
    # our packed game data onto it. Linux runners are also faster and GitHub
    # bills them at a third of the Windows rate. The extension is cross-built
    # the same way, with mingw-w64 - godot-cpp has supported that for years.
    runs-on: ubuntu-latest
    # A cold godot-cpp Windows build is the long pole, about the same eleven
    # minutes selftest.yml budgets for its Linux one. Warm, this job is ~4 min.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # The export templates are a 1.2 GB download. Fetching them on every push
      # would make each build slow and hammer Godot's CDN for no reason, so they
      # are cached under a key that changes only when GODOT_VERSION does.
      - name: Restore cached Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o ~/godot-cache/godot.zip \
            "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o ~/godot-cache/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Install Godot and export templates
        run: |
          unzip -q ~/godot-cache/godot.zip -d ~/godot-bin
          sudo install -m 755 \
            ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

          # The .tpz is a zip whose files sit under a generic "templates/" folder.
          # Godot looks for them in a folder named after the exact version, so we
          # unpack then rename. Getting this path wrong is the usual cause of
          # "No export template found" in CI.
          unzip -q ~/godot-cache/templates.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

          godot --version

      # ---------------------------------------------------------------- gdext

      - name: Install the cross-compiler and SCons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64
          pipx install scons
          x86_64-w64-mingw32-g++ --version | head -1

      # Same shape as selftest.yml's Linux cache, and deliberately a DIFFERENT
      # key: this one holds a Windows template_release build of godot-cpp, and
      # handing it to the Linux editor job (or the reverse) would be silent
      # nonsense. The key carries both pins plus the platform and target.
      - name: Restore cached godot-cpp
        id: cpp
        uses: actions/cache@v4
        with:
          path: ~/godot-cpp
          key: godot-cpp-${{ env.GODOT_CPP_COMMIT }}-godot-${{ env.GODOT_VERSION }}-windows-mingw-template_release

      # The API json must be dumped from EXACTLY the pinned binary above, not a
      # close-enough one - the same rule selftest.yml states at stage 0. It is
      # dumped into ~/godot-cpp so the cache carries it to the warm runs too.
      #
      # lto=none, against godot-cpp's default of full for a release target: full
      # LTO through mingw-w64 on a four-core runner costs more wall clock than
      # the whole rest of this job, and MSVC - which is what Marcel's Windows box
      # actually builds with - has no LTO by default either, so this is the build
      # closer to the one the game is played on.
      - name: Build godot-cpp for Windows
        if: steps.cpp.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/godotengine/godot-cpp.git ~/godot-cpp
          cd ~/godot-cpp
          git checkout "$GODOT_CPP_COMMIT"
          godot --headless --dump-extension-api
          scons platform=windows arch=x86_64 use_mingw=yes target=template_release \
            lto=none custom_api_file=extension_api.json -j"$(nproc)"

      # Only template_release: this job runs --export-release and nothing else,
      # and Godot picks exactly one library out of kubik.gdextension per export,
      # by feature tag. A template_debug build here would double the cold compile
      # to ship a file no export in this repo ever asks for.
      - name: Build the extension for Windows
        run: |
          cd gdext
          GODOT_CPP=~/godot-cpp scons platform=windows arch=x86_64 use_mingw=yes \
            target=template_release lto=none \
            custom_api_file="$HOME/godot-cpp/extension_api.json" -j"$(nproc)"
          ls -l bin/

      # The name is not cosmetic: kubik.gdextension asks for exactly this file,
      # and godot-cpp's suffix (".windows.template_release.x86_64") plus scons'
      # mingw .dll suffix are what produce it. If a godot-cpp bump ever renames
      # it, the export failure downstream is a mile of log; this is one line.
      - name: The library is named what the .gdextension asks for
        run: |
          want=gdext/bin/libkubik.windows.template_release.x86_64.dll
          test -f "$want" || {
            echo "::error::$want was not built - got: $(ls gdext/bin/ 2>&1)"
            exit 1
          }
          file -b "$want"
          case "$(file -b "$want")" in
            *PE32+*DLL*|*PE32+*dynamically*) ;;
            *) echo "::error::$want is not a 64-bit Windows DLL"; exit 1 ;;
          esac

      # ---------------------------------------------------------------- export

      # .godot/ is gitignored, so a fresh clone has no import cache and the block
      # texture is not yet a usable resource. Without this pass the export
      # succeeds but ships a game with missing textures.
      #
      # The extension loader will complain here that it cannot find a
      # linux.editor library, and that is correct and harmless: this job builds
      # the Windows library only, and the editor pass needs no mesher.
      - name: Import assets
        run: godot --headless --editor --quit --path .

      - name: Export Kubik.exe
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/Kubik.exe \
            2>&1 | tee /tmp/export.log
          ls -l build/

      # Godot has been known to report export failures on stderr while still
      # exiting 0, which would upload an empty or stub artifact and look like a
      # successful build. A real export is ~70-90 MB, so anything under 20 MB
      # means something went wrong upstream.
      - name: Verify the build is real
        run: |
          test -f build/Kubik.exe || { echo "::error::no exe was produced"; exit 1; }
          size=$(stat -c%s build/Kubik.exe)
          echo "Kubik.exe is $((size / 1024 / 1024)) MB"
          if [ "$size" -lt 20000000 ]; then
            echo "::error::exe is only $size bytes - the export template was probably missing"
            exit 1
          fi

          # AND THE CHARACTERS ARE IN IT. Every part is a .json under
          # assets/characters/parts/ since parts-data v1; .json is a native
          # Resource, so export_filter="all_resources" should carry them - but
          # "should" shipped a game with no characters in it exactly once too
          # often for anyone's taste. The pck stores its file table
          # uncompressed, so the path is findable as plain text.
          if [ "$(grep -ac "assets/characters/parts/armour.json" build/Kubik.exe)" = "0" ]; then
            echo "::error::the parts data is not in the pck - the export filter stopped carrying .json"
            exit 1
          fi

      # AND THE EXTENSION IS IN IT. Godot does not embed a GDExtension in the
      # pck; it copies the .dll next to the exe and packs the .gdextension that
      # points at it. Both halves have to be there or the player gets the
      # GDScript fallback - which still plays, silently, at a fraction of the
      # speed, which is exactly the failure nobody notices.
      - name: Verify the extension shipped
        run: |
          dll=build/libkubik.windows.template_release.x86_64.dll
          test -f "$dll" || {
            echo "::error::the extension .dll was not copied next to the exe - got: $(ls build/)"
            exit 1
          }
          echo "$(basename "$dll") is $(( $(stat -c%s "$dll") / 1024 )) KB"

          # The config that names it has to be in the pck, or the exe never
          # looks for the file sitting beside it. The pck's file table is plain
          # text, same as the parts-data gate above.
          if [ "$(grep -ac "kubik.gdextension" build/Kubik.exe)" = "0" ]; then
            echo "::error::kubik.gdextension is not in the pck - nothing will load the .dll"
            exit 1
          fi

          # And the export itself must not have quietly declined to find it.
          if grep -qiE "No GDExtension library found|Failed to copy shared object" /tmp/export.log; then
            echo "::error::the export log says the extension library was missing:"
            grep -iE "No GDExtension library found|Failed to copy shared object" /tmp/export.log
            exit 1
          fi

      # Both players must run the SAME build. Kubik never sends terrain, only a
      # seed, so two slightly different builds generate two different worlds from
      # that seed and neither machine reports an error. Stamping the commit into
      # the download at least makes "are we on the same build?" answerable.
      #
      # TODO(marcel): make the join handshake compare this build id and refuse
      # the connection on mismatch. Hint: Game._srv_send_world_state already
      # sends the seed to a joining peer - send a version string alongside it and
      # have the client bail out with a readable message instead of desyncing.
      - name: Stamp the build
        run: |
          {
            echo "commit:  ${{ github.sha }}"
            echo "branch:  ${{ github.ref_name }}"
            echo "godot:   ${GODOT_VERSION}"
            echo "gdext:   godot-cpp ${GODOT_CPP_COMMIT} (mingw-w64, template_release)"
            echo "run:     ${{ github.run_number }}"
          } > build/BUILD_INFO.txt
          cat build/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Kubik-windows-${{ github.run_number }}-${{ github.sha }}
          path: build/
          if-no-files-found: error
