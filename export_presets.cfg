; Windows Desktop export preset.
;
; This file IS committed, unlike in most Godot .gitignore templates. CI has no
; editor and cannot invent an export configuration, so the preset has to travel
; with the repo. It is safe to commit *because* codesign/enable is false: there
; are no credentials in here. If we ever sign builds, the certificate and
; password go in GitHub Actions secrets, never in this file.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"

; One file instead of Kubik.exe + Kubik.pck. Costs nothing and removes the
; "they moved the exe out of the folder and it stopped working" support call.
binary_format/embed_pck=true

; Without this Godot also emits Kubik.console.exe, which nobody asked for.
debug/export_console_wrapper=0

; Writing the icon and version strings into the exe header needs `rcedit`,
; a Windows-only tool that does not exist on a Linux CI runner. Leaving this
; false skips that step; the in-game window icon is unaffected.
application/modify_resources=false

codesign/enable=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
